<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Love Percentage Calculator</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@0,700;1,600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #ff3366;
      --primary-light: #ff6584;
      --primary-dark: #cc0033;
      --secondary: #ff85a2;
      --accent: #ffd166;
      --bg-gradient: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      --card-bg: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.18);
      --text: #ffffff;
      --text-muted: #e2d9f3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* Floating background glowing hearts */
    .bg-heart {
      position: fixed;
      color: rgba(255, 51, 102, 0.12);
      pointer-events: none;
      z-index: 0;
      animation: float 14s infinite linear;
    }
    @keyframes float {
      0% { transform: translateY(105vh) scale(0.8) rotate(0deg); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateY(-10vh) scale(1.3) rotate(360deg); opacity: 0; }
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 32px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.2);
      z-index: 1;
      position: relative;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-heart {
      display: inline-flex;
      font-size: 42px;
      filter: drop-shadow(0 0 16px rgba(255, 51, 102, 0.6));
      animation: pulse 1.8s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      margin-top: 6px;
      background: linear-gradient(45deg, #ffffff, #ffb3c6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 4px;
      letter-spacing: 0.3px;
    }

    .inputs-wrap {
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }

    .input-field {
      position: relative;
    }

    .input-field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
      color: var(--secondary);
    }

    .input-field input {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      padding: 14px 18px;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      outline: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .input-field input:focus {
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 18px rgba(255, 51, 102, 0.35);
    }

    .vs-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: #fff;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      box-shadow: 0 4px 12px rgba(255, 51, 102, 0.5);
      border: 2px solid #fff;
      pointer-events: none;
      z-index: 2;
    }

    .btn-calc {
      width: 100%;
      margin-top: 24px;
      background: linear-gradient(45deg, #ff3366, #ff6584);
      color: #fff;
      border: none;
      padding: 16px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(255, 51, 102, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-calc:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(255, 51, 102, 0.55);
    }
    .btn-calc:active {
      transform: scale(0.98);
    }

    /* Result Area */
    .result-section {
      display: none;
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px dashed rgba(255, 255, 255, 0.2);
      text-align: center;
      animation: fadeIn 0.5s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Circular SVG Gauge */
    .gauge-wrapper {
      position: relative;
      width: 160px;
      height: 160px;
      margin: 0 auto 16px auto;
    }
    .gauge-svg {
      transform: rotate(-90deg);
      width: 160px;
      height: 160px;
    }
    .gauge-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.1);
      stroke-width: 12;
    }
    .gauge-fill {
      fill: none;
      stroke: url(#loveGradient);
      stroke-width: 12;
      stroke-linecap: round;
      stroke-dasharray: 440;
      stroke-dashoffset: 440;
      transition: stroke-dashoffset 1.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .percentage-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 38px;
      font-weight: 800;
      color: #fff;
    }
    .percentage-text span {
      font-size: 20px;
      color: var(--secondary);
    }

    .verdict-title {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      color: #ffd166;
      margin-bottom: 6px;
    }

    .verdict-desc {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
      padding: 0 8px;
    }

    /* Metric bars */
    .metrics-box {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin: 20px 0;
    }
    .metric-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 6px;
      border-radius: 12px;
    }
    .metric-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }
    .metric-val {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      margin-top: 4px;
    }

    /* Actions */
    .share-btn {
      width: 100%;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      padding: 13px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .share-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Step-by-step calculation dropdown */
    details {
      margin-top: 18px;
      text-align: left;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 13px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    summary {
      cursor: pointer;
      font-weight: 600;
      color: var(--secondary);
      outline: none;
    }
    .breakdown-content {
      margin-top: 10px;
      font-family: monospace;
      font-size: 12px;
      color: #cfd6e6;
      line-height: 1.8;
      overflow-x: auto;
      white-space: pre-wrap;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #111;
      color: #fff;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 100;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Floating animated background hearts -->
  <div class="bg-heart" style="left: 10%; font-size: 32px; animation-duration: 12s;">❤️</div>
  <div class="bg-heart" style="left: 30%; font-size: 20px; animation-duration: 18s; animation-delay: 2s;">💖</div>
  <div class="bg-heart" style="left: 70%; font-size: 44px; animation-duration: 15s; animation-delay: 4s;">💕</div>
  <div class="bg-heart" style="left: 88%; font-size: 26px; animation-duration: 20s; animation-delay: 1s;">✨</div>

  <div class="container">
    <div class="header">
      <div class="logo-heart">💘</div>
      <h1>Love Meter</h1>
      <p class="subtitle">Classic algorithm based on your names</p>
    </div>

    <div class="inputs-wrap">
      <div class="input-field">
        <label for="name1">First Person</label>
        <input type="text" id="name1" placeholder="e.g., Romeo" maxlength="25" autocomplete="off" />
      </div>

      <div class="vs-icon">&</div>

      <div class="input-field" style="margin-top: 10px;">
        <label for="name2">Second Person</label>
        <input type="text" id="name2" placeholder="e.g., Juliet" maxlength="25" autocomplete="off" />
      </div>
    </div>

    <button class="btn-calc" id="calcBtn" onclick="calculateLove()">
      <span>Calculate Chemistry</span> ⚡
    </button>

    <!-- Calculation Result -->
    <div class="result-section" id="resultSection">
      <div class="gauge-wrapper">
        <svg class="gauge-svg" viewBox="0 0 160 160">
          <defs>
            <linearGradient id="loveGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ff6584" />
              <stop offset="100%" stop-color="#ff3366" />
            </linearGradient>
          </defs>
          <circle class="gauge-bg" cx="80" cy="80" r="70" />
          <circle class="gauge-fill" id="gaugeCircle" cx="80" cy="80" r="70" />
        </svg>
        <div class="percentage-text" id="pctDisplay">0<span>%</span></div>
      </div>

      <h2 class="verdict-title" id="verdictTitle">Soulmates</h2>
      <p class="verdict-desc" id="verdictDesc">A bond written in the stars.</p>

      <div class="metrics-box">
        <div class="metric-card">
          <div class="metric-label">Passion</div>
          <div class="metric-val" id="valPassion">--</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Humor</div>
          <div class="metric-val" id="valHumor">--</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Trust</div>
          <div class="metric-val" id="valTrust">--</div>
        </div>
      </div>

      <button class="share-btn" onclick="copyShareLink()">
        <span>🔗 Copy Shareable Link</span>
      </button>

      <details>
        <summary>How was this calculated?</summary>
        <div class="breakdown-content" id="breakdownLog"></div>
      </details>
    </div>
  </div>

  <div class="toast" id="toast">Link copied to clipboard!</div>

  <script>
    // Audio synthesizer for chimes & heartbeats
    const playTone = (freq, type, duration) => {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        // Fallback gracefully if audio context is blocked
      }
    };

    // Authentic LOVES Algorithm Reduction
    function computeLovesReduction(name1, name2) {
      const clean1 = name1.trim().toUpperCase().replace(/[^A-Z]/g, '');
      const clean2 = name2.trim().toUpperCase().replace(/[^A-Z]/g, '');
      const phrase = clean1 + "LOVES" + clean2;
      
      const counts = [];
      const seen = new Set();
      const logs = [];

      for (let ch of phrase) {
        if (!seen.has(ch)) {
          seen.add(ch);
          let count = 0;
          for (let c of phrase) {
            if (c === ch) count++;
          }
          counts.push(count);
        }
      }

      logs.push(`Phrase: ${phrase}`);
      logs.push(`Letter Counts: [ ${counts.join(', ')} ]`);

      let current = [...counts];
      let rowNum = 1;

      while (current.length > 2) {
        let nextRow = [];
        for (let i = 0; i < current.length - 1; i++) {
          let sum = current[i] + current[i + 1];
          if (sum >= 10) {
            sum = Math.floor(sum / 10) + (sum % 10);
          }
          nextRow.push(sum);
        }
        logs.push(`Step ${rowNum++}: ${nextRow.join(' ')}`);
        current = nextRow;
      }

      let finalPercentage = current.length === 2 ? (current[0] * 10 + current[1]) : (current[0] || 0);
      
      // Keep within realistic playful percentages (40% to 99%)
      if (finalPercentage < 40) finalPercentage = 40 + (finalPercentage % 55);

      return { percentage: finalPercentage, logs: logs.join('\n') };
    }

    function calculateLove() {
      const n1 = document.getElementById('name1').value.trim();
      const n2 = document.getElementById('name2').value.trim();

      if (!n1 || !n2) {
        showToast("Please enter both names first!");
        return;
      }

      playTone(440, 'triangle', 0.25);
      setTimeout(() => playTone(660, 'sine', 0.35), 180);

      const result = computeLovesReduction(n1, n2);
      const score = result.percentage;

      const resultSection = document.getElementById('resultSection');
      resultSection.style.display = 'block';

      // Animate SVG circle gauge (circumference = 2 * PI * 70 ≈ 440)
      const circle = document.getElementById('gaugeCircle');
      const offset = 440 - (440 * score) / 100;
      circle.style.strokeDashoffset = offset;

      // Animate percentage text counter
      const display = document.getElementById('pctDisplay');
      let current = 0;
      const stepTime = 1500 / score;
      const counter = setInterval(() => {
        current++;
        display.innerHTML = `${current}<span>%</span>`;
        if (current >= score) clearInterval(counter);
      }, stepTime);

      // Interpret verdicts
      const title = document.getElementById('verdictTitle');
      const desc = document.getElementById('verdictDesc');

      if (score >= 88) {
        title.innerText = "Cosmic Soulmates 🔥";
        desc.innerText = "Electric connection! You balance each other out with rare ease and depth.";
      } else if (score >= 70) {
        title.innerText = "Deep Chemistry ✨";
        desc.innerText = "A naturally magnetic spark. With shared laughter, this bond only grows stronger.";
      } else if (score >= 50) {
        title.innerText = "Playful Sparks 💫";
        desc.innerText = "Fun, vibrant energy with endless surprises. Keeps things lively and entertaining.";
      } else {
        title.innerText = "Unique Dynamic 🍀";
        desc.innerText = "Opposites attract! You bring completely different worldviews together.";
      }

      // Generate stable sub-metrics based on score
      document.getElementById('valPassion').innerText = `${Math.min(99, score + 3)}%`;
      document.getElementById('valHumor').innerText = `${Math.max(60, (score * 7) % 35 + 64)}%`;
      document.getElementById('valTrust').innerText = `${Math.max(55, (score * 3) % 40 + 58)}%`;

      document.getElementById('breakdownLog').textContent = result.logs;

      // Confetti burst
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 50,
          spread: 60,
          origin: { y: 0.7 },
          colors: ['#ff3366', '#ff6584', '#ffd166', '#ffffff']
        });
      }

      // Update URL parameters without reloading
      const newUrl = `${window.location.protocol}//${window.location.host}${window.location.pathname}?n1=${encodeURIComponent(n1)}&n2=${encodeURIComponent(n2)}`;
      window.history.replaceState({ path: newUrl }, '', newUrl);
    }

    function copyShareLink() {
      navigator.clipboard.writeText(window.location.href).then(() => {
        showToast("Link copied to clipboard! Share it now 🔗");
      }).catch(() => {
        showToast("Error copying link. You can copy the browser URL!");
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2600);
    }

    // Auto-calculate if query parameters are present in URL
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const param1 = params.get('n1');
      const param2 = params.get('n2');
      if (param1 && param2) {
        document.getElementById('name1').value = param1;
        document.getElementById('name2').value = param2;
        calculateLove();
      }
    });
  </script>
</body>
</html>
